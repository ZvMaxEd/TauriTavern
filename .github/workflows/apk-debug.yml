name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Report build target
        run: |
          echo "Building ref: ${{ inputs.ref }}"
          git log -1 --format='%H %s'

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Configure Android compiler
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi24-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable HTTP access for standard mobile bundle
        run: ./scripts/ci/configure-mobile-http.sh enable android

      # app/build.gradle.kts evaluates the `release` signingConfig during
      # configuration even for debug builds, casting keystore.properties
      # values to non-null String. Without the file that cast throws
      # ("null cannot be cast to non-null type kotlin.String") before any
      # compilation happens, so a throwaway key is provisioned here.
      - name: Provision a throwaway debug keystore
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/crates/tauritavern/gen/android
          keystore="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "keyAlias=androiddebugkey"
            echo "password=android"
            echo "storeFile=$keystore"
          } > keystore.properties

      - name: Build debug APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: node scripts/tauri-app.mjs --prepare-frontend android build --debug --apk --split-per-abi --target aarch64

      - name: Collect APKs
        if: always()
        run: |
          find src-tauri/crates/tauritavern/gen/android/app/build/outputs -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauritavern-debug-apk
          path: src-tauri/crates/tauritavern/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
